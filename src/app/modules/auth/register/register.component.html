<div class="register-page">

  <div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

      <div class="col-md-5 col-lg-4">

        <div class="register-card">

          <!-- Title -->
          <div class="text-center mb-4">

            <h2 class="register-title">
              Create Account 🚀
            </h2>

            <p class="register-subtitle">
              Register to start shopping
            </p>

          </div>

        <form #regForm="ngForm">

          <!-- Name -->
          <div class="mb-3">

             <label class="form-label">Full Name</label>

             <input type="text"
               class="form-control custom-input"
               placeholder="Enter your name"
               name="name"
               [(ngModel)]="user.name"
               required
               minlength="3"
               #name="ngModel">

           <!-- Error Messages -->
            <div class="text-danger" *ngIf="name.invalid && name.touched">
          
              <small *ngIf="name.errors?.['required']">
                Name is required
              </small>
          
              <small *ngIf="name.errors?.['minlength']">
                Name must be at least 3 characters
              </small>
          
            </div>

          </div>

          <!-- Email -->
          <div class="mb-3">

             <label class="form-label">Email</label>

             <input type="email"
               class="form-control custom-input"
               placeholder="Enter your email"
               name="email"
               [(ngModel)]="user.email"
               required
               email
               #email="ngModel">


              <div class="text-danger" *ngIf="email.invalid && email.touched">

               <small *ngIf="email.errors?.['required']">
                 Email is required
               </small>

               <small *ngIf="email.errors?.['email']">
                 Enter a valid email
               </small>

              </div>
           </div>

          <!-- Password -->
          <div class="mb-4">

            <label class="form-label">Password</label>

             <input type="password"
                    class="form-control custom-input"
                    placeholder="Enter your password"
                    name="password"
                    [(ngModel)]="user.password"
                    required
                    minlength="6"
                    #password="ngModel">

              <div class="text-danger" *ngIf="password.invalid && password.touched">
            
                <small *ngIf="password.errors?.['required']">
                  Password is required
                </small>
            
                <small *ngIf="password.errors?.['minlength']">
                  Password must be at least 6 characters
                </small>
            
              </div>
          </div>

          <!-- Register Button -->
           <button class="btn register-btn w-100"
           (click)="register(regForm)"
           [disabled]="regForm.invalid">
           Register
           </button>

          <!-- Login Link -->
          <div class="text-center mt-4">

            <span class="text-muted">
              Already have an account?
            </span>

            <a routerLink="/auth/login"
               class="login-link">

              Login

            </a>

          </div>
        </form>

        </div>

      </div>

    </div>

  </div>

</div>
