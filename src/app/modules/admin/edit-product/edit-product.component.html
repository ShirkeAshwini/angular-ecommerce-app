<div class="edit-wrapper">

  <div class="edit-card">

    <!-- LEFT SIDE: FORM -->
    <div class="form-section">

      <h2>✏️ Edit Product</h2>
      <p class="subtitle">Update product details below</p>

      <form [formGroup]="productForm" (ngSubmit)="updateProduct()">

        <div class="form-group">
          <label>Name</label>
          <input formControlName="Name" placeholder="Enter product name">
        </div>

        <div class="form-group">
          <label>Price</label>
          <input type="number" formControlName="Price" placeholder="Enter price">
        </div>

        <div class="form-group">
          <label>Category</label>
          <input formControlName="Category" placeholder="Enter category">
        </div>

        <div class="form-group">
          <label>Stock</label>
          <input type="number" formControlName="Stock" placeholder="Enter stock">
        </div>

        <div class="form-group">
          <label>Change Image</label>
          <input type="file" (change)="onFileSelected($event)">
        </div>

        <button class="btn-save"
                type="submit"
                [disabled]="productForm.invalid">

          💾 Update Product

        </button>

      </form>

    </div>

    <!-- RIGHT SIDE: PREVIEW -->
    <div class="preview-section">

      <h3>📦 Preview</h3>

      <div class="preview-card">

        <img [src]="imagePreview || 'assets/no-image.png'">

        <div class="preview-info">
          <h4>{{ productForm.value.Name || 'Product Name' }}</h4>
          <p>₹ {{ productForm.value.Price || 0 }}</p>
          <span>{{ productForm.value.Category || 'Category' }}</span>
        </div>

      </div>

    </div>

  </div>

</div>
