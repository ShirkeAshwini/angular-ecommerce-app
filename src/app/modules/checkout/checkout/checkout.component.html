<form #checkoutForm="ngForm">
<div class="container checkout-page mt-5">

  <div class="row g-4">

    <!-- LEFT SECTION -->
    <div class="col-lg-7">

      <div class="checkout-card shadow-sm">

        <div class="section-header">
          🛒 Order Summary
        </div>

        <div class="cart-item"
             *ngFor="let item of cartItems">

          <div class="d-flex align-items-center">

            <!-- IMAGE -->
            <div class="checkout-img-wrapper">

              <img [src]="getImageUrl(item.ImageUrl)"
                   class="checkout-img">

            </div>

            <!-- DETAILS -->
            <div class="ms-3 flex-grow-1">

              <h5 class="product-title">
                {{item.Name}}
              </h5>

              <p class="text-muted mb-1">
                {{item.Category}}
              </p>

              <span class="badge bg-primary">
                Qty: {{item.Quantity}}
              </span>

            </div>

            <!-- PRICE -->
            <div class="text-end">

              <h5 class="text-success fw-bold">
                ${{item.Price * (item.Quantity || 1)}}
              </h5>

            </div>

          </div>

        </div>

        <!-- TOTAL -->
        <div class="total-section">

          <div class="d-flex justify-content-between">

            <h4>Total Amount</h4>

            <h4 class="text-success">
              ${{totalPrice}}
            </h4>

          </div>

        </div>

      </div>

    </div>

    <!-- RIGHT SECTION -->
    <div class="col-lg-5">

      <div class="checkout-card shadow-sm">

        <div class="section-header">
          🚚 Shipping Details
        </div>

        <!-- INPUTS -->
        <div class="mb-3">

          <label class="form-label">
            Full Name
          </label>

          <input type="text"
                 class="form-control custom-input"
                 name="name"
                 placeholder="Enter your name"
                 [(ngModel)]="address.name"
                 #name="ngModel"
                 required>

                 <small class="text-danger" *ngIf="name.valid && name.touched">Full Name is required.</small>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Mobile Number
          </label>

          <input type="text"
                 class="form-control custom-input"
                 name="mobile"
                 placeholder="Enter mobile number"
                 [(ngModel)]="address.mobile"
                 #mobile="ngModel"
                 required
                 pattern="^[0-9]{10}$"
                 maxlength="10">

                 <small class="text-danger" *ngIf="mobile.errors?.['required'] && mobile.touched">
                  Enter a valid 10-digit mobile number.
                </small>
        </div>

        <div class="mb-3">

          <label class="form-label">
            City
          </label>

          <input type="text"
                 class="form-control custom-input"
                 name="city"
                 placeholder="Enter city"
                 [(ngModel)]="address.city"
                 #city="ngModel"
                 required>

                 <small class="text-danger"*ngIf="city.invalid && city.touched">
                  City is required.
                </small>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Full Address
          </label>

          <textarea class="form-control custom-input"
                    rows="4"
                    name="addressLine"
                    placeholder="Enter delivery address"
                    [(ngModel)]="address.addressLine"
                    #addressLine="ngModel"
                    required>
          </textarea>

          <small class="text-danger" *ngIf="addressLine.invalid && addressLine.touched">
               Address is required.
          </small>

        </div>

        <!-- PAYMENT -->
        <div class="payment-box">

          <h6 class="mb-3">
            💳 Payment Method
          </h6>

          <div class="form-check">

            <input class="form-check-input"
                   type="radio"
                   checked>

            <label class="form-check-label">
              Cash On Delivery
            </label>

          </div>

        </div>

        <!-- BUTTON -->
        <button class="btn place-order-btn w-100 mt-4"
                (click)="placeOrder(checkoutForm)"
                [disabled]="checkoutForm.invalid">

          🛍 Place Order

        </button>

      </div>

    </div>

  </div>

</div>
</form>
